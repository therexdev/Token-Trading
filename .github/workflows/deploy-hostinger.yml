# Auto-deploy the frontend to Hostinger over FTPS.
#
# Every push that touches frontend/ (or a manual run from the Actions tab)
# builds the site and uploads frontend/dist to Hostinger's web root, so you
# never have to zip and upload by hand again.
#
# One-time setup in GitHub -> repo Settings:
#   Secrets and variables -> Actions -> New repository secret:
#     FTP_SERVER     e.g. ftp://82.x.x.x  (or the host hPanel shows, no https)
#     FTP_USERNAME   the FTP account username from hPanel
#     FTP_PASSWORD   the FTP account password
#   (optional) Variables tab:
#     FTP_SERVER_DIR   web root to upload into (default ./public_html/)
#     ORDERBOOK_ADDRESS   contract address baked into the build
#
# Find the FTP details in hPanel -> Files -> FTP Accounts.
name: Deploy frontend to Hostinger

on:
  push:
    branches: [claude/koinos-orderbook-dex-mdkvf6, main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-hostinger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Test frontend before deployment
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          VITE_ORDERBOOK_ADDRESS: ${{ vars.ORDERBOOK_ADDRESS || '1Bke72aGbpq4brDY3m1UQxRCGBB9GPTJQz' }}
          VITE_KOINOS_RPC: ${{ vars.KOINOS_RPC || 'https://api.koinos.io' }}
          VITE_KOINOS_NETWORK: ${{ vars.KOINOS_NETWORK || 'mainnet' }}
        run: npm run build

      # hPanel displays the hostname as "ftp://185.x.x.x" and its copy button
      # includes the prefix — strip any scheme/path so a pasted value works
      - name: Normalize FTP server value
        id: ftp
        env:
          FTP_SERVER_INPUT: ${{ secrets.FTP_SERVER }}
        run: |
          server="$FTP_SERVER_INPUT"
          server="${server#ftp://}"
          server="${server#ftps://}"
          server="${server%%/*}"
          [[ "$server" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo "Invalid FTP hostname" >&2; exit 1; }
          echo "server=$server" >> "$GITHUB_OUTPUT"

      # Hostinger's FTP intermittently answers "530 Login incorrect" even
      # with valid credentials (login rate limiting after failed attempts,
      # and password changes take a few minutes to propagate). Retry with
      # a backoff long enough to ride that out before calling it a failure.
      - name: Deploy to Hostinger via FTPS
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || 21 }}
          # Fail closed if TLS or certificate verification is unavailable.
          protocol: ftps
          security: strict
          # trailing slash matters: uploads the CONTENTS of dist, not the folder
          local-dir: ./frontend/dist/
          # Hostinger FTP accounts land INSIDE the web root (public_html), so
          # upload to the FTP root itself. Override with an FTP_SERVER_DIR
          # variable only if your FTP account lands at the account home
          # (then use ./public_html/).
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # keep the server tidy but never touch unrelated files
          dangerous-clean-slate: false

      - name: Wait before retrying (rate-limit backoff)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 90

      - name: Deploy to Hostinger via FTPS (retry 1)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || 21 }}
          protocol: ftps
          security: strict
          local-dir: ./frontend/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false

      - name: Wait before final retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 180

      - name: Deploy to Hostinger via FTPS (final retry)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || 21 }}
          protocol: ftps
          security: strict
          local-dir: ./frontend/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false
