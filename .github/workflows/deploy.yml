# Optional alternative to static hosting (Hostinger etc.): deploys the
# frontend to GitHub Pages. Manual trigger only - run it from the Actions
# tab if you ever want to use it, after enabling Pages in the repo settings.
name: Deploy frontend to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # configure in Settings -> Secrets and variables -> Actions -> Variables
          VITE_ORDERBOOK_ADDRESS: ${{ vars.ORDERBOOK_ADDRESS }}
          VITE_KOINOS_RPC: ${{ vars.KOINOS_RPC || 'https://api.koinos.io' }}
          VITE_KOINOS_NETWORK: ${{ vars.KOINOS_NETWORK || 'mainnet' }}
          VITE_BIO_WALLET_API: ${{ vars.BIO_WALLET_API || 'https://koinvault.app' }}
        run: npm run build

      - name: Verify live wallet compatibility before deployment
        env:
          BIO_WALLET_API: ${{ vars.BIO_WALLET_API || 'https://koinvault.app' }}
          TRADE_ORIGIN: https://trade.koinoskit.site
        run: node scripts/check-wallet-transport.cjs

      - name: Add custom domain
        run: echo "trade.koinoskit.site" > frontend/dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
